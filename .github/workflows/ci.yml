name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: repo checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Repository checks
        run: python tests/check_repo.py

      - name: PowerShell syntax check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $failed = $true
              $parseErrors | ForEach-Object {
                Write-Host ("::error file={0},line={1}::{2}" -f `
                  $_.Extent.File, $_.Extent.StartLineNumber, $_.Message)
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All .ps1 files parse under Windows PowerShell 5.1."
